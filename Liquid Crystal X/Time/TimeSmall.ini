[Rainmeter]
Author=kop4
Update=1000
DynamicWindowSize=1
; middle-click opens the settings file
MiddleMouseDownAction=["#@#Variables.inc"]

[Metadata]
Name=LC Clock Small X
Version=1.1-x
Description=Tells time. Portable rework: relative paths, font loads from @Resources\Fonts.
Tags=Clock
License=Do whatever you want

[Variables]
@include=#@#Variables.inc
; Change this to resize the whole clock
Scale=0.80

;=============================
; Measures
;=============================

[MeasureTimeH]
Measure=Time
Format=#HourFormat#

[MeasureTimeM]
Measure=Time
Format=%M

[MeasureTimeS]
Measure=Time
Format=%S

;=============================
; Meters
;=============================

[StyleDigits]
FontColor=#color1#
FontFace=Digital-7 Mono
StringAlign=RIGHT
AntiAlias=1

;===== Background =====

[MeterBackground]
Meter=Image
ImageName=#@#timebackground#color#.png
X=0
Y=0
W=(242*#Scale#)
H=(84.5*#Scale#)
AntiAlias=1
UpdateDivider=-1

;===== Time =====

[MeterTimeH]
Meter=String
MeterStyle=StyleDigits
MeasureName=MeasureTimeH
X=(108*#Scale#)
Y=(-3*#Scale#)
FontSize=(75*#Scale#)

[MeterTimeColon]
Meter=String
MeterStyle=StyleDigits
X=(138*#Scale#)
Y=(-3*#Scale#)
Text=:
FontSize=(75*#Scale#)
UpdateDivider=-1

[MeterTimeM]
Meter=String
MeterStyle=StyleDigits
MeasureName=MeasureTimeM
X=(219*#Scale#)
Y=(-3*#Scale#)
FontSize=(75*#Scale#)

[MeterTimeS]
Meter=String
MeterStyle=StyleDigits
MeasureName=MeasureTimeS
X=(238*#Scale#)
Y=(52*#Scale#)
FontSize=(25*#Scale#)
